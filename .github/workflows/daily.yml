name: ارسال روزانه نکته مکانیکی

on:
  schedule:
    # ۰۴:۳۷ جهانی = ۰۸:۰۷ صبح به وقت ایران (دقیقه کم‌شلوغ برای جلوگیری از تأخیر گیت‌هاب)
    - cron: "37 4 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت فایل‌های پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب کتابخانه لازم
        run: pip install requests

      - name: اجرای اسکریپت ارسال
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python send_daily.py
